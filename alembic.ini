# ============================================================
# Alembic Configuration
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# La URL se sobreescribe desde app.core.config
sqlalchemy.url = postgresql+asyncpg://platform:platform123@localhost:5432/course_platform

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
